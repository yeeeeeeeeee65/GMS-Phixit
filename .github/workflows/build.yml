name: Build Android APK

on:
  push:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: |
          # 建立一個假的 google-services.json 騙過編譯器
          echo '{"project_info":{"project_number":"1","project_id":"fake"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:fake","android_client_info":{"package_name":"com.polodarb.gmsphixit"}},"api_key":[{"current_key":"fake"}],"services":{}}],"configuration_version":"3"}' > app/google-services.json
          
          # 自動尋找 gradlew 檔案所在位置並執行
          GRADLEW_PATH=$(find . -name gradlew)
          if [ -z "$GRADLEW_PATH" ]; then
            gradle assembleDebug
          else
            chmod +x $GRADLEW_PATH
            $GRADLEW_PATH assembleDebug
          fi


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gms-phixit-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
