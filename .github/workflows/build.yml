name: Build Android APK

on:
  push:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Build with Gradle
        run: |
          # 1. 強行移除所有 build.gradle(.kts) 檔案中關於 Google Services 的插件
          find . -name "build.gradle*" -exec sed -i '/com.google.gms.google-services/d' {} +
          find . -name "build.gradle*" -exec sed -i '/googleServices/d' {} +
          find . -name "build.gradle*" -exec sed -i '/com.google.firebase.crashlytics/d' {} +

          # 2. 自動尋找 gradlew 並執行
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            gradle assembleDebug
          else
            chmod +x "$GRADLEW_PATH"
            "$GRADLEW_PATH" assembleDebug
          fi


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gms-phixit-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
